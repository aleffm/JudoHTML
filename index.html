<html lang="pt">
<head>
    <link rel="manifest" href="manifest.json">
	
	<!-- Apontando para o arquivo local dentro do seu repositório -->
	<link rel="icon" type="image/png" sizes="512x512" href="icon.png">
	<link rel="icon" type="image/png" sizes="192x192" href="icon.png">
	<link rel="apple-touch-icon" href="icon.png">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Judo Aguaí</title>
      <style>
        :root {
            --bg-color: #f4f4f4;
            --text-color: #333;
            --card-bg: #f5f5f5;
            --modal-bg: #fefefe;
            --border-color: #ddd;
            --input-border: #ccc;
        }
        body.dark-mode {
            --bg-color: #1a1a1a;
            --text-color: #e0e0e0;
            --card-bg: #2d2d2d;
            --modal-bg: #2d2d2d;
            --border-color: #444;
            --input-border: #555;
        }
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.3s, color 0.3s;
        }
        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        h1 {
            text-align: center;
            color: var(--text-color);
            margin: 0;
            flex: 1;
        }
        #theme-toggle {
            padding: 10px 15px;
            background: #ffc107;
            color: #333;
            border: none;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s;
            flex-shrink: 0;
        }
        #theme-toggle:hover {
            background: #ffb300;
        }
        body.dark-mode #theme-toggle {
            background: #667bc6;
        }
        body.dark-mode #theme-toggle:hover {
            background: #5568b8;
        }
        #controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        button {
            padding: 10px 20px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background: #0056b3;
        }
        #fighters {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 15px;
        }
        .card {
            padding: 15px;
            padding-top: 55px;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            transition: transform 0.2s, box-shadow 0.2s;
            text-align: center;
            height: 90px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            background-color: var(--card-bg);
            color: var(--text-color);
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.3);
        }
        .card h3 {
            margin: 0 0 5px 0;
            font-size: 1em;
        }
        .card p {
            font-size: 0.9em;
            margin: 2px 0;
        }
        .card-belt-icon {
            position: absolute;
            top: 5px;
            left: 5px;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            background: rgba(255,255,255,0.1);
        }
        .card-belt-icon img {
            width: 35px;
            height: 35px;
            object-fit: contain;
        }
        .delete-btn {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background-color: #dc3545;
            color: white;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            transition: background-color 0.2s;
        }
        .delete-btn:hover {
            background-color: #c82333;
        }
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.5);
        }
        .modal-content {
            background-color: var(--modal-bg);
            margin: 5% auto;
            padding: 20px;
            border-radius: 10px;
            width: 90%;
            max-width: 900px;
            max-height: 80vh;
            overflow-y: auto;
            position: relative;
            box-sizing: border-box;
            color: var(--text-color);
        }
        .modal-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
        }
        .modal-belt-icon {
            width: 80px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255,255,255,0.1);
            border-radius: 8px;
            flex-shrink: 0;
        }
        .modal-belt-icon img {
            width: 75px;
            height: 75px;
            object-fit: contain;
        }
        .modal-info h2 {
            margin: 0;
        }
        .close {
            position: absolute;
            right: 15px;
            top: 15px;
            color: var(--text-color);
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }
        .close:hover {
            opacity: 0.7;
        }
        #details {
            margin-top: 20px;
        }
        #details details {
            margin: 10px 0;
            border: 1px solid var(--border-color);
            border-radius: 5px;
            padding: 5px;
            background-color: var(--card-bg);
        }
        #details summary {
            font-weight: bold;
            cursor: pointer;
            padding: 5px;
            color: var(--text-color);
        }
        #details ul {
            padding-left: 20px;
            margin: 10px 0;
        }
        #details li {
            list-style: none;
            padding: 5px 0;
            color: var(--text-color);
        }
        #details input[type="checkbox"] {
            margin-right: 8px;
        }
        #details input[type="text"],
        #details input[type="number"] {
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--input-border);
            padding: 8px;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .edit-info-container {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }
        .edit-info-container > div {
            flex: 1;
            min-width: 150px;
        }
        .edit-info-container > div:first-child {
            flex-basis: 100%;
            width: 100%;
        }
        @media (max-width: 600px) {
            .edit-info-container {
                flex-direction: column;
                gap: 10px;
            }
            .edit-info-container > div {
                width: 100%;
                min-width: auto;
            }
            .edit-info-container > div:first-child {
                flex-basis: 100%;
            }
            #details input[type="text"],
            #details input[type="number"] {
                width: 100% !important;
            }
            .header-container {
                flex-direction: column;
                gap: 10px;
            }
            #controls {
                flex-direction: column;
                align-items: center;
            }
            .modal-content {
                width: 95%;
                margin: 10% auto;
                padding: 15px;
                box-sizing: border-box;
            }
            .modal-header {
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
</head>

    <div class="header-container">
        <h1>Judo Aguaí</h1>
        <button id="theme-toggle" onclick="toggleTheme()" title="Alternar tema">☀️</button>
    </div>
    <div id="controls">
        <button onclick="importData()">Importar</button>
        <button onclick="exportData()">Exportar</button>
        <button onclick="newFighter()">+ Novo Lutador</button>
    </div>
    <div id="fighters"></div>

                    <p id="modal-belt-name"></p>
                </div>
            </div>
            <div id="details"></div>
        </div>
    </div>

-WAZA",subtype:"Kaeshi-waza",name:"De-Ashi-Barai > Ko-Soto-Gari"},{id:143,belt:3,type:"KAESHI-WAZA",subtype:"Kaeshi-waza",name:"Harai-Goshi > Yoko-Otoshi"},{id:144,belt:3,type:"KAESHI-WAZA",subtype:"Kaeshi-waza",name:"O-Goshi > Ushiro-Goshi"},{id:145,belt:4,type:"KAESHI-WAZA",subtype:"Kaeshi-waza",name:"O-Soto-Gari > Ura-Nage"},{id:146,belt:4,type:"KAESHI-WAZA",subtype:"Kaeshi-waza",name:"Harai-Goshi > Yoko-Guruma"},{id:147,belt:4,type:"KAESHI-WAZA",subtype:"Kaeshi-waza",name:"Uchi-Mata > Tani-Otoshi"},{id:148,belt:4,type:"KAESHI-WAZA",subtype:"Kaeshi-waza",name:"Morote-Gari > Sukui-Nage"},{id:149,belt:4,type:"KAESHI-WAZA",subtype:"Kaeshi-waza",name:"O-Goshi > Ushiro-Goshi"},{id:150,belt:5,type:"KAESHI-WAZA",subtype:"Kaeshi-waza",name:"Tomoe-Nage > Hikikomi-Gaeshi"},{id:151,belt:5,type:"KAESHI-WAZA",subtype:"Kaeshi-waza",name:"Morote-Gari > Tawara-Gaeshi"},{id:152,belt:5,type:"KAESHI-WAZA",subtype:"Kaeshi-waza",name:"O-Soto-Gari > Sumi-Gaeshi"},{id:153,belt:6,type:"KAESHI-WAZA",subtype:"Kaeshi-waza",name:"Harai-Goshi > Yoko-Wakare"},{id:154,belt:6,type:"KAESHI-WAZA",subtype:"Kaeshi-waza",name:"Uchi-Mata > Obi-Tori-Gaeshi"},{id:155,belt:6,type:"KAESHI-WAZA",subtype:"Kaeshi-waza",name:"Kata-Guruma > Kibisu-Gaeshi"},{id:156,belt:7,type:"KAESHI-WAZA",subtype:"Kaeshi-waza",name:"O-Soto-Gari > Te-Guruma"},{id:157,belt:7,type:"KAESHI-WAZA",subtype:"Kaeshi-waza",name:"Uchi-Mata > Uchi-Mata-Gaeshi"}];
        let fighters = [];
        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            localStorage.setItem('theme', document.body.classList.contains('dark-mode') ? 'dark' : 'light');
            updateThemeIcon();
        }
        function updateThemeIcon() {
            const isDarkMode = document.body.classList.contains('dark-mode');
            document.getElementById('theme-toggle').textContent = isDarkMode ? '🌙' : '☀️';
        }
        function loadTheme() {
            if (localStorage.getItem('theme') === 'dark') {
                document.body.classList.add('dark-mode');
            }
            updateThemeIcon();
        }
        function getAthleteCategory(birthDateStr) {
            const parts = birthDateStr.split('/');
            const age = new Date().getFullYear() - parseInt(parts[2]);
            if (age <= 8) return 'Sub9';
            if (age <= 10) return 'Sub11';
            if (age <= 12) return 'Sub13';
            if (age <= 14) return 'Sub15';
            if (age <= 17) return 'Cadete';
            if (age <= 20) return 'Junior';
            if (age <= 29) return 'Sênior';
            if (age <= 34) return 'Master 1';
            if (age <= 39) return 'Master 2';
            if (age <= 44) return 'Master 3';
            if (age <= 49) return 'Master 4';
            if (age <= 54) return 'Master 5';
            if (age <= 59) return 'Master 6';
            if (age <= 64) return 'Master 7';
            if (age <= 69) return 'Master 8';
            if (age <= 74) return 'Master 9';
            return 'Master 10';
        }
        function saveData() {
            localStorage.setItem('judoFighters', JSON.stringify(fighters));
            renderFighters();
        }
        function renderFighters() {
            const container = document.getElementById('fighters');
            if (fighters.length === 0) {
                container.innerHTML = '<p style="grid-column: 1 / -1; text-align: center; color: var(--text-color);">Nenhum lutador. Adicione um novo!</p>';
                return;
            }
            container.innerHTML = '';
            fighters.forEach((f, index) => {
                const belt = belts[f.beltIndex || 0];
                const beltFileName = getBeltFileName(f.beltIndex || 0);
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-belt-icon">
                        <img src="${getBeltImagePath(beltFileName)}" alt="Faixa ${beltFileName}" onerror="this.style.display='none'">
                    </div>
                    <h3>${f.name}</h3>
                    <p>${f.birthDate ? getAthleteCategory(f.birthDate) : 'N/A'} | ${f.weight} kg</p>
                    <p>Faixa: ${belt.name}</p>
                    <p>Aprendidos: ${f.learned ? f.learned.length : 0}/${techniques.length}</p>
                    <button class="delete-btn" onclick="deleteFighter(${index})">🗑️</button>
                `;
                card.onclick = (e) => { if (e.target.className !== 'delete-btn') openModal(index); };
                container.appendChild(card);
            });
        }
        function deleteFighter(index) {
            if (confirm('Tem certeza que deseja deletar este lutador?')) {
                fighters.splice(index, 1);
                saveData();
            }
        }
        function maskDate(event) {
            let value = event.target.value.replace(/\D/g, '');
            if (value.length >= 2) value = value.substring(0, 2) + '/' + value.substring(2);
            if (value.length >= 5) value = value.substring(0, 5) + '/' + value.substring(5, 9);
            event.target.value = value;
        }
        function openModal(fighterIndex) {
            const fighter = fighters[fighterIndex];
            const belt = belts[fighter.beltIndex || 0];
            const beltFileName = getBeltFileName(fighter.beltIndex || 0);
            document.getElementById('modal-title').textContent = fighter.name;
            document.getElementById('modal-belt-name').textContent = `Faixa ${belt.name}`;
            document.getElementById('modal-belt-img').src = getBeltImagePath(beltFileName);
            
            const learnedSet = new Set(fighter.learned || []);
            const grouped = {};
            techniques.forEach(t => {
                if (!grouped[t.belt]) grouped[t.belt] = {};
                if (!grouped[t.belt][t.type]) grouped[t.belt][t.type] = {};
                if (!grouped[t.belt][t.type][t.subtype]) grouped[t.belt][t.type][t.subtype] = [];
                grouped[t.belt][t.type][t.subtype].push(t);
            });

            let html = `
                <div style="border: 1px solid var(--border-color); padding: 15px; margin-bottom: 20px; border-radius: 5px; background: var(--card-bg);">
                    <h4>Editar Informações</h4>
                    <div class="edit-info-container">
                        <div>
                            <label>Nome:</label>
                            <input type="text" id="edit-name" value="${fighter.name}">
                        </div>
                        <div>
                            <label>Data Nasc. (DD/MM/YYYY):</label>
                            <input type="text" id="edit-birthdate" value="${fighter.birthDate}" maxlength="10" oninput="maskDate(event)">
                        </div>
                        <div>
                            <label>Peso (kg):</label>
                            <input type="number" id="edit-weight" value="${fighter.weight}" step="0.1">
                        </div>
                    </div>
                    <button onclick="saveFighterInfo(${fighterIndex})" style="padding: 8px 15px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer;">Salvar</button>
                </div>
            `;

            html += '<h4>Técnicas por Faixa</h4>';
            for (let b = 0; b < belts.length; b++) {
                if (grouped[b]) {
                    html += `<details><summary>${belts[b].name}</summary>`;
                    for (let type in grouped[b]) {
                        html += `<details><summary>${type}</summary>`;
                        for (let subtype in grouped[b][type]) {
                            const subs = grouped[b][type][subtype];
                            html += `<h4>${subtype} (${subs.length})</h4><ul>`;
                            subs.forEach(t => {
                                const checked = learnedSet.has(t.id) ? 'checked' : '';
                                html += `<li><label><input type="checkbox" data-id="${t.id}" ${checked} onchange="toggleLearned(${fighterIndex}, ${t.id}, this.checked)"> ${t.name}</label></li>`;
                            });
                            html += '</ul>';
                        }
                        html += '</details>';
                    }
                    html += '</details>';
                }
            }

            document.getElementById('details').innerHTML = html;
            document.getElementById('modal').style.display = 'block';
        }
        function saveFighterInfo(fighterIndex) {
            const newName = document.getElementById('edit-name').value.trim();
            const newBirthDate = document.getElementById('edit-birthdate').value.trim();
            const newWeight = parseFloat(document.getElementById('edit-weight').value);
            
            if (!newName || !/^\d{2}\/\d{2}\/\d{4}$/.test(newBirthDate) || isNaN(newWeight) || newWeight <= 0) {
                alert('Dados inválidos!');
                return;
            }
            
            fighters[fighterIndex].name = newName;
            fighters[fighterIndex].birthDate = newBirthDate;
            fighters[fighterIndex].weight = newWeight;
            saveData();
            closeModal();
        }
        function toggleLearned(fighterIndex, techId, isChecked) {
            if (!fighters[fighterIndex].learned) fighters[fighterIndex].learned = [];
            if (isChecked) {
                if (!fighters[fighterIndex].learned.includes(techId)) fighters[fighterIndex].learned.push(techId);
            } else {
                fighters[fighterIndex].learned = fighters[fighterIndex].learned.filter(id => id !== techId);
            }
            saveData();
            checkPromotion(fighterIndex);
        }
        function checkPromotion(fighterIndex) {
            const fighter = fighters[fighterIndex];
            const currentBelt = fighter.beltIndex || 0;
            const techsOfBelt = techniques.filter(t => t.belt === currentBelt);
            const learnedCount = fighter.learned ? fighter.learned.filter(id => techsOfBelt.some(t => t.id === id)).length : 0;
            
            if (learnedCount === techsOfBelt.length && techsOfBelt.length > 0) {
                fighter.beltIndex = currentBelt + 1;
                if (fighter.beltIndex >= belts.length) {
                    fighter.beltIndex = belts.length - 1;
                    alert('🎉 Parabéns! Você atingiu a Faixa Preta! Mestre completo!');
                } else {
                    alert(`🥋 Promoção! Você subiu para Faixa ${belts[fighter.beltIndex].name}!`);
                }
                saveData();
                renderFighters();
                closeModal();
            }
        }
        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }
        function newFighter() {
            const name = prompt('Nome do lutador:');
            if (!name || !name.trim()) return;
            const birthDate = prompt('Data de nascimento (DD/MM/YYYY):');
            if (!birthDate || !/^\d{2}\/\d{2}\/\d{4}$/.test(birthDate)) {
                alert('Formato de data inválido!');
                return;
            }
            const weight = prompt('Peso (kg):');
            if (!weight || isNaN(weight) || parseFloat(weight) <= 0) {
                alert('Peso inválido!');
                return;
            }
            fighters.push({name: name.trim(), birthDate, weight: parseFloat(weight), beltIndex: 0, learned: []});
            saveData();
        }
        function importData() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            input.onchange = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    try {
                        const data = JSON.parse(ev.target.result);
                        fighters = data.fighters || [];
                        saveData();
                    } catch (err) {
                        alert('Erro ao importar: ' + err.message);
                    }
                };
                reader.readAsText(file);
            };
            input.click();
        }
        function exportData() {
            const blob = new Blob([JSON.stringify({fighters}, null, 2)], {type: 'application/json'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'judo-progress.json';
            a.click();
            URL.revokeObjectURL(a.href);
        }
        window.addEventListener('load', () => {
            loadTheme();
            const saved = localStorage.getItem('judoFighters');
            if (saved) {
                try {
                    fighters = JSON.parse(saved);
                } catch (err) {
                    fighters = [];
                }
            }
            renderFighters();
        });
    </script>
