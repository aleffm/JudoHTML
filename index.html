<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Judo Progress Tracker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f4f4f4;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        #controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
        }
        button {
            padding: 10px 20px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background: #0056b3;
        }
        #fighters {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }
        .card {
            padding: 20px;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            transition: transform 0.2s, box-shadow 0.2s;
            text-align: center;
            height: 120px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.3);
        }
        .card h3 {
            margin: 0 0 10px 0;
            font-size: 1.2em;
        }
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.5);
        }
        .modal-content {
            background-color: #fefefe;
            margin: 5% auto;
            padding: 20px;
            border-radius: 10px;
            width: 90%;
            max-width: 900px;
            max-height: 80vh;
            overflow-y: auto;
        }
        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }
        .close:hover {
            color: #000;
        }
	.delete-btn {
    position: absolute;
    bottom: 10px;
    right: 10px;
    background-color: #dc3545;
    color: white;
    border: none;
    border-radius: 50%;
    width: 40px;
    height: 40px;
    font-size: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 5px rgba(0,0,0,0.3);
    transition: background-color 0.2s;
}

.delete-btn:hover {
    background-color: #c82333;
}
        #details {
            margin-top: 20px;
        }
        #details details {
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
            padding: 5px;
        }
        #details summary {
            font-weight: bold;
            cursor: pointer;
            padding: 5px;
        }
        #details ul {
            padding-left: 20px;
            margin: 10px 0;
        }
        #details li {
            list-style: none;
            padding: 5px 0;
        }
        #details input[type="checkbox"] {
            margin-right: 8px;
        }
	
        @media (max-width: 600px) {
            #controls {
                flex-direction: column;
                align-items: center;
            }
            .modal-content {
                width: 95%;
                margin: 10% auto;
            }
        }
    </style>
</head>

        </div>

        let fighters = [];
        function saveData() {
            localStorage.setItem('judoFighters', JSON.stringify(fighters));
            renderFighters();
        }
        function renderFighters() {
    const container = document.getElementById('fighters');
    container.innerHTML = '';
    if (fighters.length === 0) {
        container.innerHTML = '<p style="grid-column: 1 / -1; text-align: center; color: #666;">Nenhum lutador. Adicione um novo!</p>';
        return;
    }
    fighters.forEach((f, index) => {
        const belt = belts[f.beltIndex || 0];
        const card = document.createElement('div');
        card.className = 'card';
        card.style.backgroundColor = belt.color;
        card.style.color = belt.textColor;
        card.style.position = 'relative';
        card.innerHTML = `
            <h3>${f.name}</h3>
            <p>Faixa: ${belt.name}</p>
            <p>Aprendidos: ${f.learned ? f.learned.length : 0}/${techniques.length}</p>
            <button class="delete-btn" onclick="deleteFighter(${index})">🗑️</button>
        `;
        card.style.cursor = 'pointer';
        card.onclick = (e) => {
            if (e.target.className !== 'delete-btn') {
                openModal(index);
            }
        };
        container.appendChild(card);
    });
}

function deleteFighter(index) {
    if (confirm('Tem certeza que deseja deletar este lutador?')) {
        fighters.splice(index, 1);
        localStorage.setItem('judoFighters', JSON.stringify(fighters));
        renderFighters();
    }
}
        function openModal(fighterIndex) {
            const fighter = fighters[fighterIndex];
            document.getElementById('modal-title').textContent = fighter.name;
            const learnedSet = new Set(fighter.learned || []);
            const grouped = {};
            techniques.forEach(t => {
                if (!grouped[t.belt]) grouped[t.belt] = {};
                if (!grouped[t.belt][t.type]) grouped[t.belt][t.type] = {};
                if (!grouped[t.belt][t.type][t.subtype]) grouped[t.belt][t.type][t.subtype] = [];
                grouped[t.belt][t.type][t.subtype].push(t);
            });
            let html = '';
            for (let b = 0; b < belts.length; b++) {
                if (grouped[b]) {
                    html += `<details><summary>${belts[b].name}</summary>`;
                    for (let type in grouped[b]) {
                        html += `<details><summary>${type}</summary>`;
                        for (let subtype in grouped[b][type]) {
                            const subs = grouped[b][type][subtype];
                            html += `<h4>${subtype} (${subs.length})</h4><ul>`;
                            subs.forEach(t => {
                                const checked = learnedSet.has(t.id) ? 'checked' : '';
                                html += `<li><label><input type="checkbox" data-id="${t.id}" data-belt="${t.belt}" ${checked} onchange="toggleLearned(${fighterIndex}, ${t.id}, this.checked)"> ${t.name}</label></li>`;
                            });
                            html += '</ul>';
                        }
                        html += '</details>';
                    }
                    html += '</details>';
                }
            }
            document.getElementById('details').innerHTML = html;
            document.getElementById('modal').style.display = 'block';
        }
        function toggleLearned(fighterIndex, techId, isChecked) {
    if (!fighters[fighterIndex].learned) fighters[fighterIndex].learned = [];
    if (isChecked) {
        if (!fighters[fighterIndex].learned.includes(techId)) {
            fighters[fighterIndex].learned.push(techId);
        }
    } else {
        fighters[fighterIndex].learned = fighters[fighterIndex].learned.filter(id => id !== techId);
    }
    saveData();
    checkPromotion(fighterIndex);  // ← ADICIONE ISTO
}

function checkPromotion(fighterIndex) {
    const fighter = fighters[fighterIndex];
    const currentBelt = fighter.beltIndex || 0;
    const techsOfBelt = techniques.filter(t => t.belt === currentBelt);
    const learnedCount = fighter.learned ? fighter.learned.filter(id => 
        techsOfBelt.some(t => t.id === id)
    ).length : 0;
    
    if (learnedCount === techsOfBelt.length && techsOfBelt.length > 0) {
        fighter.beltIndex = currentBelt + 1;
        if (fighter.beltIndex >= belts.length) {
            fighter.beltIndex = belts.length - 1;
            alert('🎉 Parabéns! Você atingiu a Faixa Preta! Mestre completo!');
        } else {
            alert(`🥋 Promoção! Você subiu para Faixa ${belts[fighter.beltIndex].name}!`);
        }
        saveData();
        renderFighters();
        closeModal();
    }
}
        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }
        function newFighter() {
            const name = prompt('Nome do lutador:');
            if (name && name.trim()) {
                fighters.push({name: name.trim(), beltIndex: 0, learned: []});
                saveData();
            }
        }
        function importData() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            input.onchange = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    try {
                        const data = JSON.parse(ev.target.result);
                        fighters = data.fighters || [];
                        saveData();
                    } catch (err) {
                        alert('Erro ao importar JSON: ' + err.message);
                    }
                };
                reader.readAsText(file);
            };
            input.click();
        }
        function exportData() {
            const data = {fighters};
            const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'judo-progress.json';
            a.click();
            URL.revokeObjectURL(url);
        }
        // Load on start
        window.addEventListener('load', () => {
            const saved = localStorage.getItem('judoFighters');
            if (saved) {
                try {
                    fighters = JSON.parse(saved);
                } catch (err) {
                    fighters = [];
                }
            }
            renderFighters();
        });
    </script>
